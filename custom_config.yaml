# Linux sing-box 默认分流配置。订阅节点由 sing_box_auto.py 动态生成。
listen:
  address: 127.0.0.1
  port: 1080

urltest:
  url: https://www.gstatic.com/generate_204
  interval: 3m
  tolerance: 50
  idle_timeout: 30m

rule_sets:
  geoip-cn:
    url: https://gh-proxy.org/https://raw.githubusercontent.com/SagerNet/sing-geoip/rule-set/geoip-cn.srs
  geosite-cn:
    url: https://gh-proxy.org/https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-cn.srs

groups:
  - tag: us_auto
    region_keywords: ["美国", "美國", "US", "🇺🇸"]
  - tag: us_ai
    region_keywords: ["美国", "美國", "United States", "USA", "US", "🇺🇸", "日本", "Japan", "JP", "🇯🇵", "台湾", "台灣", "Taiwan", "TW", "🇹🇼", "新加坡", "Singapore", "SG", "🇸🇬", "马来西亚", "馬來西亞", "Malaysia", "MY", "🇲🇾", "泰国", "泰國", "Thailand", "TH", "🇹🇭", "越南", "Vietnam", "VN", "🇻🇳", "印度尼西亚", "印尼", "Indonesia", "ID", "🇮🇩", "澳大利亚", "澳洲", "Australia", "AU", "🇦🇺", "英国", "英國", "United Kingdom", "UK", "GB", "🇬🇧", "德国", "德國", "Germany", "DE", "🇩🇪"]
    url: https://developers.openai.com/api/docs
  - tag: sg_auto
    region_keywords: ["新加坡", "🇸🇬", "Singapore"]
  - tag: tw_auto
    region_keywords: ["台湾", "台灣", "🇹🇼", "TW"]
  - tag: uk_auto
    region_keywords: ["英国", "英國", "🇬🇧", "UK"]

rules:
  - name: 广告拦截
    domain: [ads.google.com, googleadservices.com]
    outbound: block
  - name: 美国 AI 服务
    domain: [openai.com, chatgpt.com, claude.ai, claude.com, anthropic.com, frame.claudeusercontent.com, bridge.claudeusercontent.com, gemini.google.com, aistudio.google.com]
    domain_suffix: [.openai.com, .chatgpt.com, .claude.ai, .claude.com, .anthropic.com, .frame.claudeusercontent.com, .bridge.claudeusercontent.com]
    outbound: us_ai
  - name: 美国及其他指定服务
    domain: [gfiber.com, tiktok.com]
    domain_suffix: [.tiktok.com]
    outbound: us_auto
  - name: 新加坡
    domain: [ocbc.com]
    domain_suffix: [.ocbc.com]
    outbound: sg_auto
  - name: 台湾
    domain_suffix: [.okx.com]
    outbound: tw_auto
  - name: 英国
    domain_suffix: [.uk]
    outbound: uk_auto
  - name: 国内直连
    domain: [cesu.topway.cn]
    domain_suffix: [.topway.cn]
    outbound: direct
